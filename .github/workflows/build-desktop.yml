name: Build desktop package

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      version:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      is_release:
        type: boolean
        default: false
      enable_multiplayer:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and package
    runs-on: ${{ inputs.runner }}
    env:
      FYL_VERSION: ${{ inputs.version }}
      FYL_BUILD_NAME: ${{ inputs.build_name }}
      FYL_BUILD_NUMBER: ${{ inputs.build_number }}
      FYL_IS_RELEASE: ${{ inputs.is_release && 'true' || 'false' }}
      FYL_TARGET: ${{ inputs.target }}
      FYL_ENABLE_MULTIPLAYER: ${{ inputs.enable_multiplayer && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        if: env.FYL_ENABLE_MULTIPLAYER == 'true'
        with:
          go-version: '1.26.x'
          cache-dependency-path: native/multiplayer/go.sum
      - name: Check Minecraft networking helper
        if: env.FYL_ENABLE_MULTIPLAYER == 'true'
        working-directory: native/multiplayer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            go test ./...
          else
            go test -race ./...
          fi
      - run: javac --release 8 -encoding UTF-8 -g:none -d assets/java tool/java/FylOptiFineBridge.java
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --dart-define="FYL_ENABLE_MULTIPLAYER=$FYL_ENABLE_MULTIPLAYER"
      - name: Build
        run: >-
          flutter build "$FYL_TARGET" --release --no-pub
          --build-name="$FYL_BUILD_NAME" --build-number="$FYL_BUILD_NUMBER"
          --dart-define="FYL_VERSION=$FYL_VERSION"
          --dart-define="FYL_IS_RELEASE=$FYL_IS_RELEASE"
          --dart-define="FYL_ENABLE_MULTIPLAYER=$FYL_ENABLE_MULTIPLAYER"
      - name: Package
        run: |
          extra=()
          if [[ "$FYL_ENABLE_MULTIPLAYER" == "true" ]]; then
            extra+=(--enable-multiplayer)
          fi
          python tool/release.py package --target "$FYL_TARGET" --version "$FYL_VERSION" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: FYL-${{ inputs.target }}${{ inputs.enable_multiplayer && '-multiplayer' || '' }}
          path: build/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
