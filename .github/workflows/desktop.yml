name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release/*.app
          - os: ubuntu-22.04
            target: linux
            artifact: build/linux/x64/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: javac --release 8 -encoding UTF-8 -g:none -d assets/java tool/java/FylOptiFineBridge.java
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build ${{ matrix.target }} --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: free_your_launcher-${{ matrix.target }}
          path: ${{ matrix.artifact }}
