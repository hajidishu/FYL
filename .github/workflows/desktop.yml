name: Desktop CI and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate version and release tools
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test -p release_tool_test.py -v
      - name: Validate version
        id: version
        run: python tool/release.py metadata

  desktop:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      FYL_VERSION: ${{ needs.version.outputs.version }}
      FYL_BUILD_NAME: ${{ needs.version.outputs.build_name }}
      FYL_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      FYL_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: javac --release 8 -encoding UTF-8 -g:none -d assets/java tool/java/FylOptiFineBridge.java
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build
        run: >-
          flutter build "$FYL_TARGET" --release --no-pub
          --build-name="$FYL_BUILD_NAME" --build-number="$FYL_BUILD_NUMBER"
          --dart-define="FYL_VERSION=$FYL_VERSION"
      - name: Package
        run: python tool/release.py package --target "$FYL_TARGET" --version "$FYL_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: FYL-${{ matrix.target }}
          path: build/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [version, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: FYL-*
          merge-multiple: true
          path: build/releases
      - name: Verify packages and publish
        run: python tool/release.py publish --tag "$FYL_TAG"
        env:
          FYL_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
