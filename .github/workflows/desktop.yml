name: Desktop CI and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate version and release tools
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test -p '*_test.py' -v
      - run: python tool/generate_localizations.py --check
      - name: Validate version
        id: version
        run: python tool/release.py metadata

  desktop:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
    uses: ./.github/workflows/build-desktop.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.version.outputs.version }}
      build_name: ${{ needs.version.outputs.build_name }}
      build_number: ${{ needs.version.outputs.build_number }}
      is_release: ${{ needs.version.outputs.is_release == 'true' }}
      enable_multiplayer: false

  multiplayer:
    name: Build ${{ matrix.target }} multiplayer
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
    uses: ./.github/workflows/build-desktop.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.version.outputs.version }}
      build_name: ${{ needs.version.outputs.build_name }}
      build_number: ${{ needs.version.outputs.build_number }}
      # Experimental artifacts must not update themselves to a normal release.
      is_release: false
      enable_multiplayer: true

  release:
    name: Publish GitHub Release
    needs: [version, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download Windows release package
        uses: actions/download-artifact@v4
        with:
          name: FYL-windows
          path: build/releases
      - name: Download macOS release package
        uses: actions/download-artifact@v4
        with:
          name: FYL-macos
          path: build/releases
      - name: Download Linux release package
        uses: actions/download-artifact@v4
        with:
          name: FYL-linux
          path: build/releases
      - name: Verify packages and publish
        run: python tool/release.py publish --tag "$FYL_TAG"
        env:
          FYL_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
